
name: ARM64 Software Baseline

on:
  push:
    branches:
      - apple-silicon-linux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-baseline:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect ARM64 environment
        run: |
          uname -m
          python --version
          lscpu
          cat /proc/cpuinfo

      - name: Install Revizor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q rvzr

      - name: Run ARM64 ISA loader test
        run: python -m unittest tests.arm64.unit_isa_loader -v

      - name: Run selected core unit tests
        run: |
          python -m unittest tests.unit_traces -v
          python -m unittest tests.unit_tc_components -v

          
      - name: Diagnose ARM64 generator tests
        run: |
          python -m unittest tests.arm64.unit_generators -v

          
      - name: Compile ARM64 kernel module
        shell: bash
        working-directory: rvzr/executor_km
        run: |
          set -euo pipefail

          echo "Architecture: $(uname -m)"
          echo "Kernel: $(uname -r)"
          echo "Page size: $(getconf PAGESIZE)"

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            util-linux \
            "linux-headers-$(uname -r)"

          kernel_build="/lib/modules/$(uname -r)/build"
          test -f "$kernel_build/Makefile"

          make -C "$kernel_build" \
            M="$PWD" \
            ARCH=arm64 \
            VMBUILD=1 \
            -j"$(nproc)" \
            modules

          test -s rvzr_executor.ko

          echo "ARM64 kernel module compiled successfully"

          
      - name: Compile ARM64 kernel module with PMU setup
        shell: bash
        working-directory: rvzr/executor_km
        run: |
          set -euo pipefail

          kernel_build="/lib/modules/$(uname -r)/build"

          echo "Building ARM64 executor without VMBUILD"
          echo "Kernel: $(uname -r)"

          # Remove objects from the previous VMBUILD build
          make -C "$kernel_build" \
            M="$PWD" \
            ARCH=arm64 \
            VMBUILD= \
            clean

          # Compile with PMU initialization included
          make -C "$kernel_build" \
            M="$PWD" \
            ARCH=arm64 \
            VMBUILD= \
            V=1 \
            -j"$(nproc)" \
            modules

          test -s rvzr_executor.ko

          echo "ARM64 kernel module with PMU setup compiled successfully"

          
      - name: Verify sandbox geometry and C/Python parity
        run: |
          python -m unittest \
            tests.unit_sandbox_geometry \
            tests.unit_sandbox_geometry_c \
            -v


      - name: Verify serialized input format
        run: |
          python -m unittest tests.unit_input_format -v


      - name: Verify sandbox descriptor validation
        run: |
          python -m unittest tests.unit_sandbox_descriptor -v

          
      - name: Characterize sandbox preparation lifecycle
        run: |
          python -m unittest tests.unit_preparation_lifecycle -v


      - name: Verify isolated ARM64 Unicorn model preparation
        run: |
          python -m unittest tests.unit_model_preparation -v


      - name: Verify ARM64 contract-model vertical slice
        run: |
          set -euo pipefail
          sudo apt-get install -y binutils
          python -c "import unicorn; print('Unicorn version:', unicorn.__version__)"
          python -m unittest tests.unit_arm64_contract_slice -v


      - name: Verify fixed ARM64 userspace architectural execution (no kernel module)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          gcc --version
          RVZR_REQUIRE_NATIVE=1 python -m unittest tests.unit_arm64_userspace_execution -v


      - name: Verify ARM64 conditional-speculation contract
        run: |
          set -euo pipefail
          python -c "import unicorn; print('Unicorn version:', unicorn.__version__)"
          python -m unittest \
            tests.unit_arm64_conditional_contract \
            tests.unit_arm64_contract_slice \
            -v


      - name: Verify ARM64 generated software campaign
        run: |
          set -euo pipefail
          python -c "import unicorn; print('Unicorn version:', unicorn.__version__)"
          python -m unittest tests.unit_arm64_generated_campaign -v


      - name: Verify ARM64 ADD-derived address dependencies
        run: |
          set -euo pipefail
          python -c "import unicorn; print('Unicorn version:', unicorn.__version__)"
          python -m unittest tests.unit_arm64_add_address -v


      - name: Verify ARM64 speculative taint and boosting
        run: |
          set -euo pipefail
          python -c "import unicorn; print('Unicorn version:', unicorn.__version__)"
          python -m unittest \
            tests.unit_arm64_taint_boosting \
            tests.unit_arm64_conditional_contract \
            tests.unit_arm64_contract_slice \
            -v


      - name: Characterize model coverage and resource lifetime
        run: |
          python -m unittest \
            tests.unit_model_coverage_lifecycle \
            tests.unit_model_resource_lifetime \
            -v

      - name: Verify ARM64 kernel upload parsers
        run: |
          python -m unittest tests.unit_kernel_upload_parsers -v


      - name: Verify ARM64 upload parsers with AddressSanitizer
        run: |
          RVZR_PARSER_SANITIZER=address \
            python -m unittest -f tests.unit_kernel_upload_parsers -v

      - name: Verify ARM64 upload parsers with UndefinedBehaviorSanitizer
        run: |
          RVZR_PARSER_SANITIZER=undefined \
            python -m unittest -f tests.unit_kernel_upload_parsers -v


      - name: Verify passive preparation state
        run: |
          python -m unittest tests.unit_preparation_state -v

      - name: Verify passive preparation state with AddressSanitizer
        run: |
          RVZR_PREPARATION_SANITIZER=address \
            python -m unittest -f tests.unit_preparation_state -v

      - name: Verify passive preparation state with UndefinedBehaviorSanitizer
        run: |
          RVZR_PREPARATION_SANITIZER=undefined \
            python -m unittest -f tests.unit_preparation_state -v


      - name: Verify PTE recovery error propagation
        run: python -m unittest -f tests.unit_pte_recovery_errors -v

      - name: Verify PTE recovery errors with AddressSanitizer
        run: |
          RVZR_PARSER_SANITIZER=address \
            python -m unittest -f tests.unit_pte_recovery_errors -v

      - name: Verify PTE recovery errors with UndefinedBehaviorSanitizer
        run: |
          RVZR_PARSER_SANITIZER=undefined \
            python -m unittest -f tests.unit_pte_recovery_errors -v


      - name: Characterize cache observation semantics
        run: |
          python -m unittest tests.unit_cache_observation_semantics -v


      - name: Verify timer protocol and failure handling on host
        timeout-minutes: 2
        run: python -m unittest tests.unit_arm64_timer_calibration -v


      - name: Smoke test native ARM64 architectural timer
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            tools/arm64_timer_calibration.c -o "$RUNNER_TEMP/arm64-timer"
          python tools/verify_arm64_timer.py "$RUNNER_TEMP/arm64-timer" \
            --output "$RUNNER_TEMP/arm64-timer.jsonl"



  arm64-kernel-16k:
    name: Fedora Asahi 16 KB kernel build
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    container:
      image: registry.fedoraproject.org/fedora@sha256:b148221886c7dfc09c5e3d5ec01ec1c51b774b65121709bc7d88d5e6fbee27dd

    defaults:
      run:
        shell: bash

    steps:
      - name: Install container tools
        run: |
          dnf -y install git curl util-linux binutils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile against Fedora Asahi 16 KB kernel
        working-directory: rvzr/executor_km

        env:
          DEVEL_URL: https://download.copr.fedorainfracloud.org/results/@asahi/kernel/fedora-44-aarch64/10130065-kernel/kernel-16k-devel-6.18.10-402.asahi.fc44.aarch64.rpm
          DEVEL_SHA256: 37e6e53a85f33eda8ec216da52d64a7ca1554d687a389edd48d7abc021816832

        run: |
          set -euo pipefail

          echo "=== Download kernel development package ==="

          devel_rpm="$RUNNER_TEMP/kernel-16k-devel.rpm"

          curl --fail --location --retry 3 \
            "$DEVEL_URL" -o "$devel_rpm"

          printf '%s  %s\n' "$DEVEL_SHA256" "$devel_rpm" \
            | sha256sum --check

          dnf -y install "$devel_rpm"

          echo "=== Verify kernel configuration ==="

          kernel_build="/usr/src/kernels/6.18.10-402.asahi.fc44.aarch64+16k"

          test -s "$kernel_build/Module.symvers"

          grep -qx 'CONFIG_ARM64_16K_PAGES=y' \
            "$kernel_build/.config"

          grep -qx '#define CONFIG_ARM64_16K_PAGES 1' \
            "$kernel_build/include/generated/autoconf.h"

          echo "Host architecture: $(uname -m)"
          echo "Running kernel: $(uname -r)"
          echo "Host page size: $(getconf PAGESIZE)"
          echo "Target kernel: $(cat "$kernel_build/include/config/kernel.release")"

          gcc --version | head -n 1
          rpm -q kernel-16k-devel

          echo "=== Compile Revizor kernel module ==="

          make -C "$kernel_build" \
            M="$PWD" \
            ARCH=arm64 \
            VMBUILD= \
            -j"$(nproc)" \
            modules

          test -s rvzr_executor.ko

          echo "=== Verify module ==="

          readelf -h rvzr_executor.ko

          echo "Fedora Asahi 16 KB kernel compilation PASSED"


  arm64-kernel-fc45-16k:
    name: Fedora Asahi 45 16 KB kernel build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    permissions:
      contents: read

    container:
      # Fedora's 45 manifest index selects this Linux/ARM64 image; config also verifies ARM64.
      image: registry.fedoraproject.org/fedora@sha256:f7cc7fb58fd3dfa2d32591c4f45fc5acc9ebd95a7ee3de8de732c428c178a00f

    defaults:
      run:
        shell: bash

    env:
      CONTAINER_IMAGE: registry.fedoraproject.org/fedora@sha256:f7cc7fb58fd3dfa2d32591c4f45fc5acc9ebd95a7ee3de8de732c428c178a00f
      KERNEL_RELEASE: 7.1.13-402.asahi.fc45.aarch64+16k
      DEVEL_URL: https://download.copr.fedorainfracloud.org/results/@asahi/kernel/fedora-45-aarch64/Packages/k/kernel-16k-devel-7.1.13-402.asahi.fc45.aarch64.rpm
      DEVEL_SHA256: 5f27bba98614799314d7fe2fc6286c8b1944d8abbf588b48318ef7b8a8d582fb
      SIGNING_KEY_URL: https://download.copr.fedorainfracloud.org/results/@asahi/kernel/pubkey.gpg
      # COPR @asahi/kernel fingerprint: 9E4DF9135D39DDFFC77B514EB2D8704E00C08EA0.
      SIGNING_KEY_SHA256: 93372b0c24fdb10b6d6204ebedf8861b0dceffa7998b4d6c70f55bd69fe86668

    steps:
      - name: Install Fedora 45 container tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          source /etc/os-release
          test "$ID" = fedora
          test "$VERSION_ID" = 45
          dnf -y install git curl util-linux binutils file kmod rpm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile against Fedora Asahi 45 16 KB kernel
        working-directory: rvzr/executor_km
        run: |
          set -euo pipefail
          export LC_ALL=C

          devel_rpm="$RUNNER_TEMP/kernel-16k-devel-fc45.rpm"
          signing_key="$RUNNER_TEMP/asahi-kernel.gpg"
          curl --fail --location --retry 3 "$DEVEL_URL" -o "$devel_rpm"
          curl --fail --location --retry 3 "$SIGNING_KEY_URL" -o "$signing_key"
          printf '%s  %s\n' "$DEVEL_SHA256" "$devel_rpm" | sha256sum --check
          printf '%s  %s\n' "$SIGNING_KEY_SHA256" "$signing_key" | sha256sum --check
          rpmkeys --import "$signing_key"
          rpmkeys --checksig --verbose "$devel_rpm" \
            | tee "$RUNNER_TEMP/fc45-rpm-signature.log"
          # Require a verified signature from the pinned key, not only valid digests.
          grep -Ei 'signature.*00c08ea0.*: OK$' "$RUNNER_TEMP/fc45-rpm-signature.log"
          test "$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "$devel_rpm")" \
            = kernel-16k-devel-7.1.13-402.asahi.fc45.aarch64
          dnf -y --setopt=localpkg_gpgcheck=1 install "$devel_rpm"

          kernel_build="/usr/src/kernels/$KERNEL_RELEASE"
          test -s "$kernel_build/Makefile"
          test -s "$kernel_build/Module.symvers"
          test "$(cat "$kernel_build/include/config/kernel.release")" = "$KERNEL_RELEASE"
          grep -Fx "#define UTS_RELEASE \"$KERNEL_RELEASE\"" \
            "$kernel_build/include/generated/utsrelease.h"
          for option in ARM64 ARM64_16K_PAGES MODULES; do
            grep -qx "CONFIG_$option=y" "$kernel_build/.config"
            grep -qx "#define CONFIG_$option 1" "$kernel_build/include/generated/autoconf.h"
          done
          case "$(gcc -dumpmachine)" in
            aarch64-*) ;;
            *) echo "Expected a native AArch64 GCC toolchain" >&2; exit 1 ;;
          esac

          
          repo_commit="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$repo_commit" = "$GITHUB_SHA"
          printf 'Repository commit: %s\n' "$repo_commit"

          printf 'Workflow commit: %s\nContainer: %s\n' "$GITHUB_SHA" "$CONTAINER_IMAGE"
          printf 'Target kernel: %s\nHost kernel: %s\nHost page size: %s\n' \
            "$KERNEL_RELEASE" "$(uname -r)" "$(getconf PAGESIZE)"
          cat /etc/os-release
          gcc --version
          ld --version
          rpm --version
          rpm -q kernel-16k-devel
          rpm -q gcc binutils make elfutils-libelf-devel openssl-devel
          sha256sum "$devel_rpm" "$signing_key"

          # Separate clean builds; neither variant is installed or executed.
          for variant in vmbuild non-vmbuild; do
            vm_flag=1
            if [ "$variant" = non-vmbuild ]; then vm_flag=; fi
            make -C "$kernel_build" M="$PWD" ARCH=arm64 VMBUILD="$vm_flag" clean
            make -C "$kernel_build" M="$PWD" ARCH=arm64 CC=gcc VMBUILD="$vm_flag" \
              V=1 -j"$(nproc)" modules 2>&1 | tee "$RUNNER_TEMP/fc45-$variant-build.log"
            test -s rvzr_executor.ko
            cp rvzr_executor.ko "$RUNNER_TEMP/rvzr_executor-fc45-$variant.ko"
          done

      - name: Verify Fedora Asahi 45 module metadata
        run: |
          set -euo pipefail
          export LC_ALL=C
          for variant in vmbuild non-vmbuild; do
            module="$RUNNER_TEMP/rvzr_executor-fc45-$variant.ko"
            printf 'Variant: %s\n' "$variant"
            file "$module"
            readelf -h "$module" | tee "$RUNNER_TEMP/fc45-$variant-elf.log"
            grep -Eq 'Class:[[:space:]]+ELF64' "$RUNNER_TEMP/fc45-$variant-elf.log"
            grep -Eq 'Type:[[:space:]]+REL \(Relocatable file\)' \
              "$RUNNER_TEMP/fc45-$variant-elf.log"
            grep -Eq 'Machine:[[:space:]]+AArch64' "$RUNNER_TEMP/fc45-$variant-elf.log"
            modinfo "$module"
            vermagic="$(modinfo -F vermagic "$module")"
            test "${vermagic%% *}" = "$KERNEL_RELEASE"
            sha256sum "$module"
            # Full diagnostics are already in the build log; repeat relevant lines for review.
            awk 'tolower($0) ~ /warning:|error:|undefined!|undefined reference|unresolved/' \
              "$RUNNER_TEMP/fc45-$variant-build.log"
          done
          echo "Compile-only checks passed; no Apple M3 Pro runtime or executor safety validation."

